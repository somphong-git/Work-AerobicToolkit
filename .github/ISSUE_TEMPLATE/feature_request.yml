name: Feature request
description: Propose a focused, testable improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Proposals start as a discussion of the user problem. Please describe the
        outcome before proposing a detailed implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected, and what outcome is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest valuable behavior, not just a technology choice.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that indicate the request is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or why no change is acceptable.
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
