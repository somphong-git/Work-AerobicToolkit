[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work-aerobictoolkit"
version = "0.1.0"
description = "Open-source toolkit for creating professional aerobic DJ mixes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
audio = [
    "librosa",
    "numpy",
    "pandas",
    "soundfile",
    "pydub",
    "mutagen",
]
dev = ["pytest", "ruff"]

[project.scripts]
aerobictoolkit = "aerobictoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

